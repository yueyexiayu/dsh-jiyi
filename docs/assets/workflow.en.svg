<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc">
<title id="title">How jiyi captures and recalls memory</title><desc id="desc">Conceptual diagram, not a runtime screenshot. Explicit facts are extracted after normal user turns and stored locally. New inputs trigger scoped retrieval, independent relevance checks and original-fact references.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#79a999" stroke-width="1.5"/></marker></defs>
<rect x=".5" y=".5" width="1119" height="409" rx="20" fill="#f5faf7" stroke="#dcebe4"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<text x="40" y="48" font-size="27" font-weight="650" fill="#173c35">Memory with context. Context with boundaries.</text>
<text x="40" y="78" font-size="15" fill="#658076">Capture explicit facts. Recall only what the question supports.</text><text x="1080" y="47" text-anchor="end" font-size="12" fill="#7e948b">CONCEPT DIAGRAM</text>
<text x="40" y="118" font-size="13" font-weight="600" fill="#377760">01 / CAPTURE · after a normal user turn</text>
<g stroke="#79a999" fill="none" stroke-width="1.7" marker-end="url(#arrow)"><path d="M326 166h83"/><path d="M706 166h83"/></g>
<path d="M940 200v29H426v48" fill="none" stroke="#b1cbbf" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<g>
<rect x="40" y="132" width="280" height="68" rx="13" fill="#fff" stroke="#d4e4db"/><text x="60" y="160" font-size="18" font-weight="600" fill="#254b3d">User evidence</text><text x="60" y="183" font-size="13" fill="#71857a">Explicit, attributable facts</text>
<rect x="420" y="132" width="280" height="68" rx="13" fill="#f3f0fd" stroke="#dad4ed"/><text x="440" y="160" font-size="18" font-weight="600" fill="#514978">Background extraction</text><text x="440" y="183" font-size="13" fill="#79718f">Provider LLM · bounded queue</text><text x="677" y="158" text-anchor="end" font-size="10" font-weight="600" fill="#9385b2">LLM</text>
<rect x="800" y="132" width="280" height="68" rx="13" fill="#e7f4ed" stroke="#b9d9c9"/><text x="820" y="160" font-size="18" font-weight="600" fill="#254b3d">Local durable memory</text><text x="820" y="183" font-size="13" fill="#648374">SQLite · FTS5 · 384-d vectors</text>
</g>
<text x="40" y="258" font-size="13" font-weight="600" fill="#377760">02 / RECALL · when new user input arrives</text>
<g stroke="#79a999" fill="none" stroke-width="1.7" marker-end="url(#arrow)"><path d="M280 317h18"/><path d="M549 317h18"/><path d="M818 317h18"/></g>
<g>
<rect x="40" y="283" width="234" height="68" rx="13" fill="#fff" stroke="#d4e4db"/><text x="58" y="311" font-size="18" font-weight="600" fill="#254b3d">New input</text><text x="58" y="334" font-size="13" fill="#71857a">No facts preloaded on open</text>
<rect x="309" y="283" width="234" height="68" rx="13" fill="#fff" stroke="#d4e4db"/><text x="327" y="311" font-size="18" font-weight="600" fill="#254b3d">Scoped candidates</text><text x="327" y="334" font-size="13" fill="#71857a">FTS5 + local MiniLM</text>
<rect x="578" y="283" width="234" height="68" rx="13" fill="#f3f0fd" stroke="#dad4ed"/><text x="596" y="311" font-size="18" font-weight="600" fill="#514978">Grounded selection</text><text x="596" y="334" font-size="13" fill="#79718f">id / version / quote</text>
<rect x="847" y="283" width="234" height="68" rx="13" fill="#e7f4ed" stroke="#b9d9c9"/><text x="865" y="311" font-size="18" font-weight="600" fill="#254b3d">Original references</text><text x="865" y="334" font-size="13" fill="#648374">Evidence, not instructions</text>
</g>
<text x="40" y="386" font-size="13" fill="#6b8377">Local: storage &amp; embeddings　·　Provider network: extraction &amp; relevance LLMs　·　Similarity is not permission to inject.</text>
</g></svg>
